<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#252c3b" stroke-width="6"/>

  <!-- Glowing Emerald Inner Ring -->
  <circle cx="256" cy="256" r="172" fill="#111620" stroke="url(#emeraldGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- Central Emerald Coin Circle -->
  <circle cx="256" cy="256" r="130" fill="url(#emeraldGrad)"/>

  <!-- Dark Inner Cutout -->
  <circle cx="256" cy="256" r="114" fill="#0d1015"/>

  <!-- Centered Dollar Symbol -->
  <text x="256" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="200" font-weight="900" text-anchor="middle" fill="#34d399">$</text>
  
  <!-- Sparkle Accents -->
  <circle cx="360" cy="150" r="10" fill="#34d399"/>
  <circle cx="150" cy="360" r="8" fill="#10b981"/>
</svg>
